<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIForAll</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(135deg,#ff9933,#fff5e6,#138808);
  color:#1f2937;
}

/* Ashoka Chakra */
body::before {
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:500px;
  height:500px;
  transform:translate(-50%,-50%);
  background:url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg') no-repeat center;
  background-size:contain;
  opacity:0.05;
  z-index:-1;
}

/* NAV */
.navbar {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.navbar button {
  background:#d97706;
  color:white;
  font-weight:bold;
  padding:10px;
  border:none;
  border-radius:10px;
}

/* CONTROLS */
.controls {
  text-align:center;
  margin:20px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:12px;
  padding:20px;
}

/* CARDS */
.card {
  padding:15px;
  border-radius:12px;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

/* LEFT */
.left {
  background: linear-gradient(135deg,#ff8c00,#ffd699);
}

/* CENTER */
.center {
  background:#1e3a8a;
}

/* RIGHT */
.right {
  background: linear-gradient(135deg,#065f46,#1e3a8a);
}

/* DETAIL */
.panel {
  background:#064e3b;
  color:white;
  margin:20px;
  padding:25px;
  border-radius:14px;
  line-height:1.6;
}
</style>

</head>

<body>

<div class="navbar">
<button onclick="render()">🏠 Home</button>
</div>

<div class="controls">
<h3>What do you need AI help with?</h3>
<select id="goal" onchange="recommend()">
<option value="all">All</option>
<option value="writing">Writing</option>
<option value="coding">Coding</option>
<option value="research">Research</option>
<option value="design">Design</option>
</select>
</div>

<div id="grid" class="grid"></div>
<div id="detail" class="panel" style="display:none;"></div>

<script>

const tools = [
{name:"ChatGPT",cat:"writing",score:95,link:"https://chat.openai.com"},
{name:"Claude",cat:"writing",score:92,link:"https://claude.ai"},
{name:"Perplexity",cat:"research",score:90,link:"https://perplexity.ai"},
{name:"Cursor",cat:"coding",score:93,link:"https://cursor.sh"},
{name:"Copilot",cat:"coding",score:89,link:"https://github.com/copilot"},
{name:"Midjourney",cat:"design",score:94,link:"https://midjourney.com"},
{name:"Gemini",cat:"writing",score:88,link:"https://gemini.google.com"},
{name:"Kling",cat:"design",score:85,link:"#"}
];

function renderGrid(list){
let html="";
list.forEach((t,i)=>{

let style = i%3==0?"left":i%3==1?"center":"right";

html+=`
<div class="card ${style}" onclick="showDetail(${i})">
<span>${t.name}</span>
<span>${t.score}%</span>
</div>`;
});
document.getElementById("grid").innerHTML=html;
}

function recommend(){
let val=document.getElementById("goal").value;

let filtered = val==="all"?tools:tools.filter(t=>t.cat===val);

// ensure minimum 4
while(filtered.length<4){
filtered.push(...tools.slice(0,4-filtered.length));
}

renderGrid(filtered);
}

function showDetail(i){

let t=tools[i];

document.getElementById("detail").style.display="block";
document.getElementById("detail").innerHTML=`
<h2>${t.name}</h2>
<a href="${t.link}" target="_blank">🚀 Open Tool</a>

<h3>What is it?</h3>
<p>${t.name} is a powerful AI tool used for ${t.cat} tasks.</p>

<h3>Free Version</h3>
<p>The free version allows beginners to explore core features such as basic usage, testing workflows, and learning how AI behaves.</p>

<h3>Limitations</h3>
<p>The free version often has slower speed, limited access to advanced models, and fewer capabilities for complex tasks.</p>

<h3>Paid Version</h3>
<p>Entry price: ₹1600/month. Unlocks faster responses, better accuracy, and advanced tools.</p>

<h3>Why Upgrade?</h3>
<p>The paid version significantly enhances performance and unlocks advanced features that improve productivity. Users gain access to faster processing speeds, more intelligent responses, and additional tools that are not available in the free version. For professionals or frequent users, this results in better outputs and time savings.</p>

<h3>Final Recommendation</h3>
<p>${t.score>90?"Upgrade recommended for serious users.":"Free version is sufficient for beginners."}</p>
`;
}

// INIT
renderGrid(tools);

</script>

</body>
</html>
