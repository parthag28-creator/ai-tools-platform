<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIForAll</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';

  /* 🇮🇳 Brighter Gradient */
  background: linear-gradient(135deg,#ff9933,#fff5e6,#138808);
  color:#1f2937;
}

/* Ashoka Chakra */
body::before {
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:500px;
  height:500px;
  transform:translate(-50%,-50%);
  background:url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg') no-repeat center;
  background-size:contain;
  opacity:0.05;
  z-index:-1;
}

/* HEADER */
header {
  padding:20px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
  background:rgba(255,255,255,0.7);
}

/* NAV */
.navbar {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.navbar button {
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#ffb366;
  cursor:pointer;
}

/* CONTROLS */
.controls {
  text-align:center;
  margin:15px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:20px;
}

.card {
  background: rgba(255,255,255,0.85);
  padding:15px;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
}

/* PANEL */
.panel {
  background:white;
  margin:20px;
  padding:25px;
  border-radius:16px;
  line-height:1.6;
}

/* BUTTON */
button {
  padding:10px;
  margin:5px;
  border-radius:8px;
}
</style>

</head>

<body>

<header>🌍 AIForAll — Explore AI Confidently</header>

<div class="navbar">
<button onclick="goBack()">⬅ Back</button>
<button onclick="goForward()">➡ Forward</button>
<button onclick="goHome()">🏠 Home</button>
</div>

<div class="controls">
<select id="goal">
<option>Writing</option>
<option>Coding</option>
<option>Research</option>
<option>Design</option>
<option>Presentation</option>
</select>
<button onclick="recommend()">Find Tools</button>
</div>

<div id="grid" class="grid"></div>

<div id="detail" class="panel" style="display:none;"></div>

<script>

// DATA
const tools = [
{
name:"ChatGPT",
cat:"writing",
link:"https://chat.openai.com",
desc:"ChatGPT is an advanced AI assistant capable of writing, coding, researching, and solving complex problems in a conversational way.",
best:"Best for writing, studying, coding help, and productivity.",
free:"The free version allows users to chat, write essays, summarize text, and get basic coding help.",
limit:"Limited access to advanced models and slower performance during peak usage.",
paid:"The paid version (~₹1600/month) unlocks faster responses, advanced models, image generation, and higher accuracy.",
why:"Upgrading to the paid version of ChatGPT significantly improves both speed and capability. Users get access to more advanced AI models that produce better reasoning, more accurate outputs, and richer responses. Additionally, features like image generation, file uploads, and deeper analysis tools become available. For professionals, students, and creators, this translates to saving time and producing higher-quality work. If you rely on AI frequently for research, writing, or coding, the paid plan becomes a powerful productivity multiplier."
},

{
name:"Claude",
cat:"writing",
link:"https://claude.ai",
desc:"Claude is an AI focused on natural writing and deep understanding of large documents.",
best:"Best for long-form writing, document analysis, and professional communication.",
free:"Free version allows writing, summaries, and document interaction.",
limit:"Fewer integrations and features compared to competitors.",
paid:"Paid plan improves context size and response quality.",
why:"Claude’s paid version is particularly valuable for users working with large documents such as reports, contracts, or research papers."
},

{
name:"Perplexity",
cat:"research",
link:"https://perplexity.ai",
desc:"Perplexity is an AI-powered search engine that provides direct answers with sources.",
best:"Best for research and fact-checking.",
free:"Basic research queries with citations.",
limit:"Limited deep research capabilities.",
paid:"Pro plan unlocks deeper search and better models.",
why:"The paid version enhances research depth, making it ideal for analysts and students."
}
];

// STATE
let state={view:"home",tool:null};
let historyStack=[];
let forwardStack=[];

// NAV
function saveState(){
historyStack.push(JSON.stringify(state));
forwardStack=[];
}

function goBack(){
if(historyStack.length){
forwardStack.push(JSON.stringify(state));
state=JSON.parse(historyStack.pop());
render();
}
}

function goForward(){
if(forwardStack.length){
historyStack.push(JSON.stringify(state));
state=JSON.parse(forwardStack.pop());
render();
}
}

function goHome(){
saveState();
state={view:"home",tool:null};
render();
}

// GRID
function renderGrid(list){
let html="";
list.forEach((t,i)=>{
html+=`<div class="card" onclick="openDetail(${i})">${t.name}</div>`;
});
document.getElementById("grid").innerHTML=html;
}

// DETAIL
function openDetail(i){
saveState();
state={view:"detail",tool:i};
render();
}

function render(){

document.getElementById("grid").style.display="none";
document.getElementById("detail").style.display="none";

if(state.view==="home"){
document.getElementById("grid").style.display="grid";
renderGrid(tools);
}

if(state.view==="detail"){
let t=tools[state.tool];
document.getElementById("detail").style.display="block";

document.getElementById("detail").innerHTML=`
<h2>${t.name}</h2>

<a href="${t.link}" target="_blank">🚀 Open Tool</a>

<h3>What is it?</h3>
<p>${t.desc}</p>

<h3>Best For</h3>
<p>${t.best}</p>

<h3>Free Version</h3>
<p>${t.free}</p>

<h3>Limitations</h3>
<p>${t.limit}</p>

<h3>Paid Version</h3>
<p>${t.paid}</p>

<h3>Why Upgrade?</h3>
<p>${t.why}</p>
`;
}
}

// RECOMMEND
function recommend(){
let goal=document.getElementById("goal").value.toLowerCase();
renderGrid(tools.filter(t=>t.cat===goal));
}

// INIT
render();

</script>

</body>
</html>
