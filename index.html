<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Tools Intelligence Platform</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#0f172a;
  color:#e2e8f0;
}

/* Header */
header {
  background:#020617;
  padding:15px 20px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #1e293b;
}

/* Layout */
.container {
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar {
  width:250px;
  background:#020617;
  padding:20px;
  border-right:1px solid #1e293b;
}

.sidebar h3 {
  color:#94a3b8;
  margin-bottom:10px;
}

.sidebar button {
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#1e293b;
  border:none;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

.sidebar button:hover {
  background:#334155;
}

/* Content */
.content {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

/* Cards */
.card {
  background:#020617;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #1e293b;
  transition:0.2s;
}

.card:hover {
  transform:translateY(-3px);
  border-color:#38bdf8;
}

/* Title */
.card h3 {
  margin:0;
}

/* Tags */
.tag {
  display:inline-block;
  padding:4px 8px;
  margin:5px 5px 0 0;
  background:#1e293b;
  border-radius:5px;
  font-size:12px;
}

/* Score badge */
.score {
  float:right;
  background:#22c55e;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
}

/* Section title */
.section-title {
  font-size:18px;
  margin-bottom:10px;
}

/* Footer */
.footer {
  text-align:center;
  padding:10px;
  font-size:12px;
  color:#64748b;
}
</style>

</head>

<body>

<header>
AI Tools Intelligence Platform
</header>

<div class="container">

<!-- Sidebar -->
<div class="sidebar">
<h3>Navigation</h3>

<button onclick="filter('all')">All Tools</button>
<button onclick="filter('productivity')">Productivity</button>
<button onclick="filter('coding')">Coding</button>
<button onclick="filter('image')">Image</button>

</div>

<!-- Content -->
<div class="content">

<div class="section-title">Top AI Tools (2026)</div>

<div id="tools"></div>

<div class="footer">
Built with AI • Your Intelligence Dashboard
</div>

</div>

</div>

<script>

const tools = [
{name:"ChatGPT", category:"productivity", score:92, best_for:["content","research"]},
{name:"Claude", category:"productivity", score:90, best_for:["content"]},
{name:"Perplexity", category:"productivity", score:88, best_for:["research"]},
{name:"Midjourney", category:"image", score:89, best_for:["design"]},
{name:"Cursor", category:"coding", score:91, best_for:["coding"]}
];

function render(list){
let html="";
list.forEach(t=>{
html+=`
<div class="card">
<span class="score">${t.score}</span>
<h3>${t.name}</h3>
<div>
${t.best_for.map(tag=>`<span class="tag">${tag}</span>`).join("")}
</div>
</div>
`;
});
document.getElementById("tools").innerHTML=html;
}

function filter(category){
if(category==="all") render(tools);
else render(tools.filter(t=>t.category===category));
}

render(tools);

</script>

</body>
</html>
