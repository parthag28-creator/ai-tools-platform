<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIForAll</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(135deg,#ff9933,#fff5e6,#138808);
  color:#1f2937;
}

/* Ashoka Chakra */
body::before {
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:500px;
  height:500px;
  transform:translate(-50%,-50%);
  background:url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg') no-repeat center;
  background-size:contain;
  opacity:0.05;
  z-index:-1;
}

/* HEADER */
header {
  padding:20px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
  background:rgba(255,255,255,0.7);
}

/* NAV */
.navbar {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.navbar button {
  background:#d97706;
  color:white;
  font-weight:bold;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

/* CONTROLS */
.controls {
  text-align:center;
  margin:20px;
}

.controls select {
  padding:10px;
  border-radius:8px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:15px;
  padding:20px;
}

.card {
  background:#1e3a8a;
  color:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  font-weight:bold;
}

/* PANEL */
.panel {
  background:#064e3b;
  color:white;
  margin:20px;
  padding:25px;
  border-radius:16px;
  line-height:1.6;
}

a {
  color:#facc15;
  font-weight:bold;
}
</style>

</head>

<body>

<header>🌍 AIForAll — Global AI Explorer</header>

<div class="navbar">
<button onclick="goBack()">⬅ Back</button>
<button onclick="goForward()">➡ Forward</button>
<button onclick="goHome()">🏠 Home</button>
</div>

<div class="controls">
<h3>What do you need AI help with?</h3>
<select id="goal" onchange="recommend()">
<option value="all">All</option>
<option value="writing">Writing</option>
<option value="coding">Coding</option>
<option value="research">Research</option>
<option value="design">Design</option>
<option value="video">Video</option>
</select>
</div>

<div id="grid" class="grid"></div>

<div id="detail" class="panel" style="display:none;"></div>

<script>

// DATASET (GLOBAL)
const tools = [
{name:"ChatGPT",cat:"writing",link:"https://chat.openai.com",desc:"Advanced AI assistant for writing, coding and more.",best:"Writing, coding, research",free:"Basic chat and writing",limit:"Limited advanced features",paid:"₹1600/month unlocks advanced AI, faster speed, image tools",why:"The paid version dramatically improves performance, enabling better reasoning, faster outputs, and access to premium features like image generation and file uploads."},

{name:"Claude",cat:"writing",link:"https://claude.ai",desc:"AI for deep writing and analysis.",best:"Long documents",free:"Basic writing",limit:"Fewer integrations",paid:"₹1600/month for better context",why:"Claude shines for long documents and deep analysis, making the upgrade useful for professionals."},

{name:"Perplexity",cat:"research",link:"https://perplexity.ai",desc:"AI search engine with sources.",best:"Research",free:"Basic answers",limit:"Limited deep queries",paid:"₹1600/month for pro research",why:"The pro version provides deeper insights and better source-backed answers."},

{name:"Midjourney",cat:"design",link:"https://midjourney.com",desc:"AI image generator.",best:"Creative visuals",free:"No free tier",limit:"Paid only",paid:"₹800/month",why:"Delivers unmatched artistic quality for designers."},

{name:"Gemini",cat:"writing",link:"https://gemini.google.com",desc:"Google AI assistant.",best:"General tasks",free:"Basic usage",limit:"Inconsistent",paid:"₹1600/month",why:"Integrates well with Google ecosystem."},

{name:"Qwen",cat:"writing",link:"#",desc:"Alibaba AI model.",best:"General AI",free:"Free",limit:"UI limited",paid:"Free",why:"Good alternative free AI."},

{name:"ERNIE",cat:"research",link:"#",desc:"Baidu AI system.",best:"Search",free:"Free",limit:"Region locked",paid:"Free",why:"Useful for Chinese ecosystem."},

{name:"Kling",cat:"video",link:"#",desc:"AI video generator.",best:"Video",free:"Limited",limit:"Restricted",paid:"₹1200/month",why:"Great for creators."}
];

// STATE
let state={view:"home",tool:null};
let historyStack=[];
let forwardStack=[];

// NAV
function saveState(){
historyStack.push(JSON.stringify(state));
forwardStack=[];
}

function goBack(){
if(historyStack.length){
forwardStack.push(JSON.stringify(state));
state=JSON.parse(historyStack.pop());
render();
}
}

function goForward(){
if(forwardStack.length){
historyStack.push(JSON.stringify(state));
state=JSON.parse(forwardStack.pop());
render();
}
}

function goHome(){
saveState();
state={view:"home",tool:null};
render();
}

// GRID
function renderGrid(list){
let html="";
list.forEach((t,i)=>{
html+=`<div class="card" onclick="openDetail(${i})">${t.name}</div>`;
});
document.getElementById("grid").innerHTML=html;
}

// DETAIL
function openDetail(i){
saveState();
state={view:"detail",tool:i};
render();
}

// RENDER
function render(){

document.getElementById("grid").style.display="none";
document.getElementById("detail").style.display="none";

if(state.view==="home"){
document.getElementById("grid").style.display="grid";
renderGrid(tools);
}

if(state.view==="detail"){
let t=tools[state.tool];

document.getElementById("detail").style.display="block";
document.getElementById("detail").innerHTML=`
<h2>${t.name}</h2>
<a href="${t.link}" target="_blank">🚀 Open Tool</a>

<h3>What is it?</h3>
<p>${t.desc}</p>

<h3>Best For</h3>
<p>${t.best}</p>

<h3>Free Version</h3>
<p>${t.free}</p>

<h3>Limitations</h3>
<p>${t.limit}</p>

<h3>Paid Version</h3>
<p>${t.paid}</p>

<h3>Why Upgrade?</h3>
<p>${t.why}</p>
`;
}
}

// FILTER
function recommend(){
let val=document.getElementById("goal").value;
if(val==="all") renderGrid(tools);
else renderGrid(tools.filter(t=>t.cat===val));
}

// INIT
render();

</script>

</body>
</html>
