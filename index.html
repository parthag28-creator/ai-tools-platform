<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Tools Intelligence Platform</title>

<style>
body {margin:0; font-family:'Segoe UI'; background:#0f172a; color:#e2e8f0;}
header {background:#020617; padding:15px; border-bottom:1px solid #1e293b;}
.container {display:flex; height:100vh;}

.sidebar {
  width:260px;
  background:#020617;
  padding:20px;
  border-right:1px solid #1e293b;
}

.sidebar button, .sidebar select {
  width:100%;
  margin:5px 0;
  padding:8px;
  border:none;
  border-radius:6px;
  background:#1e293b;
  color:#fff;
}

.content {flex:1; padding:20px; overflow-y:auto;}

.card {
  background:#020617;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #1e293b;
}

.tag {
  background:#1e293b;
  padding:3px 6px;
  margin:3px;
  display:inline-block;
  border-radius:4px;
}

.score {
  float:right;
  background:#22c55e;
  padding:4px 8px;
  border-radius:5px;
}

canvas {margin-top:10px;}
</style>

</head>

<body>

<header>
AI Tools Intelligence Platform
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>User</h3>
<button onclick="login()">Login with Google</button>
<button onclick="logout()">Logout</button>
<div id="userInfo">Not logged in</div>

<h3>Smart Recommendations</h3>

<select id="goal">
<option value="content">Content</option>
<option value="coding">Coding</option>
<option value="research">Research</option>
<option value="design">Design</option>
</select>

<select id="level">
<option value="beginner">Beginner</option>
<option value="pro">Professional</option>
</select>

<select id="budget">
<option value="free">Free</option>
<option value="paid">Paid</option>
</select>

<button onclick="smartRecommend()">Get Recommendations</button>

<div id="results"></div>

<h3>Saved</h3>
<button onclick="viewSaved()">View Saved Tools</button>
<div id="savedList"></div>

</div>

<!-- CONTENT -->
<div class="content">

<h2>AI Tools Dashboard</h2>

<div>
<button onclick="sortBy('score')">Sort by Score</button>
<button onclick="sortBy('name')">Sort by Name</button>
</div>

<canvas id="chart" width="600" height="300"></canvas>

<div id="tools"></div>

</div>

</div>

<!-- FIREBASE (ADD YOUR KEYS LATER) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function(){
  const provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider)
    .then(result=>{
      localStorage.setItem("user", JSON.stringify(result.user));
      updateUser();
    });
}

window.logout = function(){
  signOut(auth);
  localStorage.removeItem("user");
  updateUser();
}

window.updateUser = function(){
  let user = JSON.parse(localStorage.getItem("user"));
  document.getElementById("userInfo").innerText =
    user ? "👤 " + user.displayName : "Not logged in";
}

updateUser();
</script>

<script>

// DATA
const tools = [
{name:"ChatGPT", category:"productivity", score:92, free:true, best_for:["content","research"]},
{name:"Claude", category:"productivity", score:90, free:true, best_for:["content"]},
{name:"Perplexity", category:"productivity", score:88, free:true, best_for:["research"]},
{name:"Midjourney", category:"image", score:89, free:false, best_for:["design"]},
{name:"Cursor", category:"coding", score:91, free:false, best_for:["coding"]}
];

let currentTools = [...tools];

// RENDER
function render(list){
let html="";
list.forEach(t=>{
html+=`
<div class="card">
<span class="score">${t.score}</span>
<h3>${t.name}</h3>
<div>
${t.best_for.map(tag=>`<span class="tag">${tag}</span>`).join("")}
</div>
</div>
`;
});
document.getElementById("tools").innerHTML=html;
}

// SORT
function sortBy(type){
if(type==="score") currentTools.sort((a,b)=>b.score-a.score);
if(type==="name") currentTools.sort((a,b)=>a.name.localeCompare(b.name));
render(currentTools);
drawChart(currentTools);
}

// CHART
function drawChart(list){
let ctx = document.getElementById("chart").getContext("2d");
ctx.clearRect(0,0,600,300);

let max = Math.max(...list.map(t=>t.score));

list.forEach((t,i)=>{
let x=i*100+40;
let h=(t.score/max)*200;

ctx.fillStyle="#38bdf8";
ctx.fillRect(x,250-h,50,h);

ctx.fillStyle="#fff";
ctx.fillText(t.name,x,270);
});
}

// SMART RECOMMEND
function smartRecommend(){
let goal=document.getElementById("goal").value;
let level=document.getElementById("level").value;
let budget=document.getElementById("budget").value;

let scored = tools.map(t=>{
let score=0;
score+=t.score*0.4;
if(t.best_for.includes(goal)) score+=30;
if(budget==="free" && t.free) score+=20;
if(level==="beginner" && t.free) score+=10;
if(level==="pro" && !t.free) score+=10;
return {...t, finalScore:Math.round(score)};
});

scored.sort((a,b)=>b.finalScore-a.finalScore);

let top=scored.slice(0,3);

let html="<h4>Top Picks</h4>";
top.forEach(t=>{
html+=`
<div class="card">
<b>${t.name}</b><br>
Score: ${t.finalScore}<br>
<button onclick="saveTool('${t.name}')">Save</button>
</div>
`;
});

document.getElementById("results").innerHTML=html;
}

// SAVE
function saveTool(name){
let saved=JSON.parse(localStorage.getItem("savedTools"))||[];
if(!saved.includes(name)){
saved.push(name);
localStorage.setItem("savedTools",JSON.stringify(saved));
alert("Saved!");
}
}

// VIEW SAVED
function viewSaved(){
let saved=JSON.parse(localStorage.getItem("savedTools"))||[];
let html="<h4>Saved Tools</h4>";
saved.forEach(n=> html+=`<p>${n}</p>`);
document.getElementById("savedList").innerHTML=html;
}

// INIT
render(currentTools);
drawChart(currentTools);

</script>

</body>
</html>
