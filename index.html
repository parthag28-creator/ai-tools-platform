<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIForAll — AI Tools Intelligence Platform</title>

<style>
body {margin:0;font-family:Segoe UI;background:#0f172a;color:#e2e8f0;}
header {background:#020617;padding:15px;font-size:20px;font-weight:bold;}
.container{display:flex;height:100vh;}
.sidebar{width:280px;background:#020617;padding:20px;border-right:1px solid #1e293b;overflow:auto;}
.content{flex:1;padding:20px;overflow:auto;}
button,select,input{width:100%;margin:6px 0;padding:8px;border-radius:6px;border:none;background:#1e293b;color:white;}
.card{background:#020617;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #1e293b;}
.score{float:right;background:#22c55e;padding:4px 8px;border-radius:5px;}
.tag{background:#1e293b;padding:3px 6px;margin:3px;border-radius:4px;display:inline-block;}
a{color:#38bdf8;text-decoration:none;}
</style>

</head>
<body>

<header>AIForAll — AI Intelligence Platform (2026)</header>

<div class="container">

<div class="sidebar">

<h3>User</h3>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
<div id="userInfo"></div>

<h3>Search</h3>
<input id="search" placeholder="Search tools..." oninput="searchTools()">

<h3>Filter</h3>
<select id="category">
<option value="all">All</option>
<option value="image">Image</option>
<option value="coding">Coding</option>
<option value="productivity">Productivity</option>
<option value="presentation">Presentation</option>
<option value="video">Video</option>
</select>
<button onclick="applyFilter()">Apply</button>

<h3>Recommend</h3>
<select id="goal">
<option value="content">Content</option>
<option value="coding">Coding</option>
<option value="research">Research</option>
<option value="design">Design</option>
</select>
<button onclick="recommend()">Get AI Picks</button>
<div id="recommendations"></div>

<h3>Actions</h3>
<button onclick="downloadCSV()">Download CSV</button>
<button onclick="window.print()">Download PDF</button>

</div>

<div class="content">

<h2>Dashboard</h2>
<button onclick="sortByScore()">Sort by Score</button>
<button onclick="sortByPrice()">Sort by Price</button>

<canvas id="chart" width="700" height="300"></canvas>

<div id="tools"></div>

<h2>Insights</h2>
<div class="card">
<p><b>Trend:</b> AI tools are shifting toward multi-modal + agent workflows.</p>
<p><b>Insight:</b> Free tools offer 80% capability for beginners.</p>
<p><b>Recommendation:</b> Use ChatGPT + Perplexity combo for max value.</p>
</div>

</div>

</div>

<script>

// ===== LOGIN =====
function login(){
let name=prompt("Enter your name");
if(name){localStorage.setItem("user",name);updateUser();}
}
function logout(){localStorage.removeItem("user");updateUser();}
function updateUser(){
let u=localStorage.getItem("user");
document.getElementById("userInfo").innerText=u?"👤 "+u:"Not logged in";
}

// ===== DATA =====
const tools=[
{name:"ChatGPT",cat:"productivity",price:20,free:true,feat:95,ease:90,perf:95,innov:95,best:["content","research"],link:"https://chat.openai.com"},
{name:"Claude",cat:"productivity",price:20,free:true,feat:92,ease:92,perf:94,innov:90,best:["content"],link:"https://claude.ai"},
{name:"Perplexity",cat:"productivity",price:20,free:true,feat:88,ease:90,perf:90,innov:88,best:["research"],link:"https://perplexity.ai"},
{name:"Midjourney",cat:"image",price:10,free:false,feat:95,ease:70,perf:96,innov:90,best:["design"],link:"https://midjourney.com"},
{name:"Ideogram",cat:"image",price:0,free:true,feat:90,ease:88,perf:90,innov:85,best:["design"],link:"https://ideogram.ai"},
{name:"Cursor",cat:"coding",price:20,free:false,feat:95,ease:88,perf:95,innov:92,best:["coding"],link:"https://cursor.sh"},
{name:"Copilot",cat:"coding",price:10,free:false,feat:92,ease:92,perf:94,innov:90,best:["coding"],link:"https://github.com/copilot"},
{name:"Canva AI",cat:"presentation",price:10,free:true,feat:90,ease:95,perf:88,innov:85,best:["design"],link:"https://canva.com"},
{name:"Gamma",cat:"presentation",price:8,free:true,feat:88,ease:90,perf:85,innov:85,best:["content"],link:"https://gamma.app"},
{name:"Veo 3.1",cat:"video",price:0,free:true,feat:92,ease:85,perf:90,innov:92,best:["design"],link:"#"}
];

// ===== SCORE =====
function score(t){
return Math.round(t.feat*0.3+(t.free?100:70)*0.2+(100-t.price*2)*0.15+t.ease*0.1+t.perf*0.15+t.innov*0.1);
}
tools.forEach(t=>t.score=score(t));

let current=[...tools];

// ===== RENDER =====
function render(list){
let html="";
list.forEach(t=>{
html+=`<div class="card">
<span class="score">${t.score}</span>
<h3><a href="${t.link}" target="_blank">${t.name}</a></h3>
${t.best.map(b=>`<span class="tag">${b}</span>`).join("")}
<p>$${t.price}/mo</p>
<button onclick="save('${t.name}')">⭐ Save</button>
</div>`;
});
document.getElementById("tools").innerHTML=html;
drawChart(list);
}

// ===== CHART =====
function drawChart(list){
let c=document.getElementById("chart").getContext("2d");
c.clearRect(0,0,700,300);
let max=Math.max(...list.map(t=>t.score));
list.forEach((t,i)=>{
let x=i*80+20;
let h=(t.score/max)*200;
c.fillStyle="#38bdf8";
c.fillRect(x,250-h,40,h);
c.fillText(t.name,x,270);
});
}

// ===== FILTER =====
function applyFilter(){
let cat=document.getElementById("category").value;
current=cat==="all"?tools:tools.filter(t=>t.cat===cat);
render(current);
}

// ===== SEARCH =====
function searchTools(){
let q=document.getElementById("search").value.toLowerCase();
render(tools.filter(t=>t.name.toLowerCase().includes(q)));
}

// ===== SORT =====
function sortByScore(){current.sort((a,b)=>b.score-a.score);render(current);}
function sortByPrice(){current.sort((a,b)=>a.price-b.price);render(current);}

// ===== RECOMMEND =====
function recommend(){
let goal=document.getElementById("goal").value;
let ranked=tools.map(t=>{
let s=t.score+(t.best.includes(goal)?20:0);
return {...t,final:s};
}).sort((a,b)=>b.final-a.final);

let html="<h4>Top Picks</h4>";
ranked.slice(0,3).forEach(t=>html+=`<p>${t.name} (${t.final})</p>`);
document.getElementById("recommendations").innerHTML=html;
}

// ===== SAVE =====
function save(name){
let s=JSON.parse(localStorage.getItem("saved")||"[]");
if(!s.includes(name)){s.push(name);localStorage.setItem("saved",JSON.stringify(s));alert("Saved");}
}

// ===== CSV =====
function downloadCSV(){
let csv="Name,Category,Score\n";
tools.forEach(t=>csv+=`${t.name},${t.cat},${t.score}\n`);
let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="ai-tools.csv";
a.click();
}

// INIT
updateUser();
render(current);

</script>

</body>
</html>
