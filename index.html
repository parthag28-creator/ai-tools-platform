<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIForAll — Global AI Platform</title>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  background: linear-gradient(135deg,#60a5fa,#34d399,#facc15);
}

header {
  padding:20px;
  text-align:center;
  font-size:24px;
  background:white;
}

.container {
  padding:20px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.card:hover {
  transform:scale(1.05);
}

/* DETAIL PANEL */
.detail {
  margin-top:20px;
  background:white;
  padding:20px;
  border-radius:12px;
}

/* CONTROLS */
.controls {
  margin:20px 0;
}

button, select {
  padding:10px;
  margin:5px;
  border-radius:6px;
}

/* PROGRESS */
.progress {
  height:10px;
  background:#ddd;
  border-radius:5px;
}

.bar {
  height:10px;
  width:0%;
  background:green;
}
</style>

</head>

<body>

<header>🌍 AIForAll — Explore AI Easily</header>

<div class="container">

<div class="controls">

<label>What do you want help with?</label><br>

<select id="goal">
<option>Writing</option>
<option>Coding</option>
<option>Research</option>
<option>Design</option>
<option>Presentation</option>
<option>Video</option>
<option>Automation</option>
<option>Learning</option>
</select>

<button onclick="recommend()">Show Best Tools</button>

</div>

<div class="grid" id="grid"></div>

<div id="detail" class="detail" style="display:none;"></div>

<h3>Learning Mode</h3>
<button onclick="startLearning()">Start Guided Learning</button>

<div class="progress"><div id="bar" class="bar"></div></div>
<div id="learning"></div>

<br>

<button onclick="downloadGuide()">Download Beginner Guide</button>

</div>

<script>

// ===== DATASET =====
const tools = [
{
name:"ChatGPT",
strength:"All-in-one AI",
weak:"Occasional errors",
free:"Chat, writing",
paid:"Advanced AI ₹1600",
use:"Writing, coding, research"
},
{
name:"Claude",
strength:"Best writing",
weak:"Limited tools",
free:"Docs, writing",
paid:"Advanced reasoning ₹1600",
use:"Writing"
},
{
name:"Perplexity",
strength:"Best research",
weak:"Less creative",
free:"Search",
paid:"Deep research ₹1600",
use:"Research"
},
{
name:"Midjourney",
strength:"Best art",
weak:"No free plan",
free:"None",
paid:"₹800 images",
use:"Design"
},
{
name:"Canva AI",
strength:"Easy design",
weak:"Basic AI",
free:"Templates",
paid:"Premium ₹800",
use:"Presentation"
},
{
name:"Cursor",
strength:"Coding AI",
weak:"Needs dev knowledge",
free:"Basic coding",
paid:"Full AI ₹1600",
use:"Coding"
},
{
name:"Copilot",
strength:"Autocomplete",
weak:"Limited reasoning",
free:"Trial",
paid:"₹800",
use:"Coding"
},
{
name:"Gemini",
strength:"Google integration",
weak:"Inconsistent",
free:"Basic AI",
paid:"Advanced ₹1600",
use:"General"
},
{
name:"Qwen",
strength:"Strong Chinese AI",
weak:"Limited global UI",
free:"Yes",
paid:"Enterprise",
use:"General"
},
{
name:"ERNIE",
strength:"Baidu AI",
weak:"Limited outside China",
free:"Yes",
paid:"Enterprise",
use:"Search"
}
];

// ===== RENDER GRID =====
function render(){
let html="";
tools.forEach((t,i)=>{
html+=`<div class="card" onclick="showDetail(${i})">${t.name}</div>`;
});
document.getElementById("grid").innerHTML=html;
}

// ===== DETAIL PANEL =====
function showDetail(i){
let t = tools[i];

document.getElementById("detail").style.display="block";

document.getElementById("detail").innerHTML = `
<h2>${t.name}</h2>
<p><b>Use:</b> ${t.use}</p>
<p><b>Free:</b> ${t.free}</p>
<p><b>Paid:</b> ${t.paid}</p>
<p><b>Strength:</b> ${t.strength}</p>
<p><b>Weakness:</b> ${t.weak}</p>
`;
}

// ===== RECOMMEND =====
function recommend(){
let goal = document.getElementById("goal").value.toLowerCase();

let filtered = tools.filter(t=>t.use.toLowerCase().includes(goal));

document.getElementById("grid").innerHTML =
filtered.map((t,i)=>`<div class="card" onclick="showDetail(${i})">${t.name}</div>`).join("");
}

// ===== LEARNING =====
let step=0;

function startLearning(){
step=0;
next();
}

function next(){
let steps = [
"Open the AI tool",
"Type your first prompt",
"Review output",
"Improve prompt",
"Use regularly"
];

if(step < steps.length){
document.getElementById("learning").innerHTML = steps[step];
document.getElementById("bar").style.width = ((step+1)/steps.length)*100 + "%";
step++;
setTimeout(next,1000);
}else{
document.getElementById("learning").innerHTML = "🎉 Completed!";
}
}

// ===== GUIDE =====
function downloadGuide(){

let text = `
AI BEGINNER GUIDE

1. Introduction to AI
AI helps automate tasks.

2. Writing with AI
Example prompts...

3. Coding with AI
...

4. Research
...

5. Best Practices
- Be clear
- Iterate

(Full multi-section guide continues...)
`;

let blob=new Blob([text]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="AI_Guide.txt";
a.click();
}

// INIT
render();

</script>

</body>
</html>
