<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AIForAll</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(135deg,#ff9933,#fff5e6,#138808);
  color:#1f2937;
}

/* Ashoka Chakra */
body::before {
  content:"";
  position:fixed;
  top:50%;
  left:50%;
  width:500px;
  height:500px;
  transform:translate(-50%,-50%);
  background:url('https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg') no-repeat center;
  background-size:contain;
  opacity:0.05;
  z-index:-1;
}

/* NAV */
.navbar {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.navbar button {
  background:#d97706;
  color:white;
  font-weight:bold;
  padding:10px;
  border:none;
  border-radius:10px;
}

/* CONTROLS */
.controls {
  text-align:center;
  margin:20px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:12px;
  padding:20px;
}

/* CARDS */
.card {
  padding:15px;
  border-radius:12px;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

/* LEFT */
.left {
  background: linear-gradient(135deg,#ff8c00,#ffd699);
}

/* CENTER */
.center {
  background:#1e3a8a;
}

/* RIGHT */
.right {
  background: linear-gradient(135deg,#065f46,#1e3a8a);
}

/* DETAIL PANEL (UPDATED) */
.panel {
  background:#ff8c00; /* saffron/orange */
  color:white;
  margin:20px;
  padding:25px;
  border-radius:14px;
  line-height:1.35; /* tighter spacing */
}
</style>

</head>

<body>

<div class="navbar">
<button onclick="render()">🏠 Home</button>
</div>

<div class="controls">
<h3>What do you need AI help with?</h3>
<select id="goal" onchange="recommend()">
<option value="all">All</option>
<option value="writing">Writing</option>
<option value="coding">Coding</option>
<option value="research">Research</option>
<option value="design">Design</option>
</select>
</div>

<div id="grid" class="grid"></div>
<div id="detail" class="panel" style="display:none;"></div>

<script>

const tools = [
{name:"ChatGPT",cat:"writing",score:95,link:"https://chat.openai.com"},
{name:"Claude",cat:"writing",score:92,link:"https://claude.ai"},
{name:"Perplexity",cat:"research",score:90,link:"https://perplexity.ai"},
{name:"Cursor",cat:"coding",score:93,link:"https://cursor.sh"},
{name:"Copilot",cat:"coding",score:89,link:"https://github.com/copilot"},
{name:"Midjourney",cat:"design",score:94,link:"https://midjourney.com"},
{name:"Gemini",cat:"writing",score:88,link:"https://gemini.google.com"},
{name:"Kling",cat:"design",score:85,link:"#"}
];

function renderGrid(list){
let html="";
list.forEach((t,i)=>{

let style = i%3==0?"left":i%3==1?"center":"right";

html+=`
<div class="card ${style}" onclick="showDetail(${i})">
<span>${t.name}</span>
<span>${t.score}%</span>
</div>`;
});
document.getElementById("grid").innerHTML=html;
}

function recommend(){
let val=document.getElementById("goal").value;
let filtered = val==="all"?tools:tools.filter(t=>t.cat===val);

while(filtered.length<4){
filtered.push(...tools.slice(0,4-filtered.length));
}

renderGrid(filtered);
}

function showDetail(i){

let t=tools[i];

document.getElementById("detail").style.display="block";
document.getElementById("detail").innerHTML=`
<h2>${t.name}</h2>
<a href="${t.link}" target="_blank">🚀 Open Tool</a>

<h3>What is it?</h3>
<p>${t.name} is a powerful AI system designed to assist users in ${t.cat} tasks. It works by understanding natural language inputs and generating intelligent outputs that can help in solving problems, creating content, or automating workflows. For beginners, it acts like a smart assistant, while for professionals, it becomes a productivity tool that can significantly reduce manual effort. Over time, as you interact more with it, you will learn how to give better instructions and receive more accurate outputs.</p>

<h3>Free Version</h3>
<p>The free version is ideal for beginners and casual users. It allows you to explore the core capabilities of the tool such as generating text, answering questions, and performing basic tasks. This is extremely useful for students, learners, and individuals who want to understand how AI works without investing money. However, it is important to note that while the free version is powerful, it may not always provide the fastest responses or the most advanced features.</p>

<h3>Limitations</h3>
<p>The limitations of the free version include slower response times, restricted access to advanced models, and limitations on usage during peak hours. In practical terms, this means that while you can still perform most tasks, you may experience delays or slightly lower-quality outputs when handling complex queries. Understanding these limitations helps set the right expectations and allows users to decide when an upgrade might be beneficial.</p>

<h3>Paid Version</h3>
<p>The entry-level paid version, typically priced around ₹1600 per month, unlocks enhanced capabilities such as faster response speeds, access to more advanced AI models, and additional features that improve overall performance. These improvements are especially noticeable when working on professional tasks, large documents, or complex problem-solving scenarios.</p>

<h3>Why Upgrade?</h3>
<p>Upgrading to the paid version becomes valuable when you start relying on the AI tool regularly for work, studies, or creative tasks. The improved speed ensures that you can complete tasks more efficiently, while the enhanced intelligence of the model provides better accuracy and deeper insights. Additionally, access to premium features allows you to handle more complex workflows, making the tool not just helpful but essential. For professionals, this often translates into time savings and improved output quality, making the investment worthwhile.</p>

<h3>Final Recommendation</h3>
<p>${t.score>90?"If you are a serious user, upgrading is strongly recommended as it will significantly enhance your productivity and experience.":"For beginners, the free version is more than sufficient to start learning and exploring AI capabilities before deciding to upgrade."}</p>
`;
}

renderGrid(tools);

</script>

</body>
</html>
